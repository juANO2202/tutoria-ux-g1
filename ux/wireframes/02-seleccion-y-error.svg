ight="700" fill="#222" text-anchor="middle">Atrás</text><circle cx="332" cy="501" r="11" fill="#222"/><text x="332" y="505" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="36" y="543" width="288" height="36" rx="6" fill="#333" stroke="#444"/><text x="180" y="566" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Continuar</text><text x="372" y="80" font-size="14" font-weight="700" fill="#222" text-anchor="start">Anotaciones</text><circle cx="382" cy="108" r="11" fill="#222"/><text x="382" y="112" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="402" y="112" font-size="12" font-weight="400" fill="#222" text-anchor="start">El error dice qué pasó y cómo seguir.</text><text x="402" y="129" font-size="12" font-weight="400" fill="#222" text-anchor="start">El foco se mueve al mensaje.</text><circle cx="382" cy="166" r="11" fill="#222"/><text x="382" y="170" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="402" y="170" font-size="12" font-weight="400" fill="#222" text-anchor="start">Solo se ofrecen días con agenda.</text><circle cx="382" cy="207" r="11" fill="#222"/><text x="382" y="211" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="402" y="211" font-size="12" font-weight="400" fill="#222" text-anchor="start">Horario ocupado: visible,</text><text x="402" y="228" font-size="12" font-weight="400" fill="#222" text-anchor="start">deshabilitado y rotulado con texto.</text><circle cx="382" cy="265" r="11" fill="#222"/><text x="382" y="269" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="402" y="269" font-size="12" font-weight="400" fill="#222" text-anchor="start">Atrás conserva las selecciones.</text></svg>
